<title>hiflora</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: two full-screen stages (Flora's chat, the gut world) that cross-fade; the species flashcard is a sheet over either */
:root{
  --sage:#5A7A66; --sage-deep:#3D5A48; --sage-soft:#DCE5DD;
  --cream:#F3EEE6; --paper:#FBF8F3; --ink:#24302A; --muted:#6B7A70; --line:rgba(36,48,42,.12);
  --serif:"Instrument Serif",Georgia,"Times New Roman",serif;
  --sans:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);overflow:hidden;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
.stage{position:fixed;inset:0;opacity:0;pointer-events:none;transition:opacity .6s ease}
.stage.on{opacity:1;pointer-events:auto}
#stage-world{background:#1a0e22}

/* Species flashcard */
.pf-scrim{position:fixed;inset:0;background:rgba(24,32,28,.38);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);
  display:flex;align-items:flex-end;justify-content:center;z-index:50;
  padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));
  padding-bottom:max(12px,env(safe-area-inset-bottom,0px));animation:pfFade .25s ease}
.pf{width:100%;max-width:560px;max-height:min(86vh,860px);overflow:auto;overscroll-behavior:contain;background:var(--paper);
  border-radius:28px;box-shadow:0 30px 80px rgba(20,30,24,.35);animation:pfRise .42s cubic-bezier(.2,.9,.3,1.1)}
.pf-hero{position:relative;height:220px;border-radius:28px 28px 0 0;overflow:hidden;
  background:radial-gradient(120% 90% at 50% 100%,color-mix(in srgb,var(--pc) 55%,white) 0%,color-mix(in srgb,var(--pc) 22%,var(--paper)) 55%,var(--paper) 100%)}
.pf-hero canvas{position:absolute;inset:0;width:100%;height:100%}
.pf-close{position:absolute;top:14px;right:14px;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);
  background:rgba(251,248,243,.8);color:var(--ink);font-size:20px;line-height:1;cursor:pointer;backdrop-filter:blur(8px)}
.pf-close:focus-visible,.pf a:focus-visible{outline:2px solid var(--sage);outline-offset:2px}
.pf-body{padding:4px 22px 26px}
.pf-chip{display:inline-flex;align-items:center;gap:8px;font-size:11.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.pf-chip i{width:10px;height:10px;border-radius:50%;background:var(--pc);box-shadow:0 0 0 3px color-mix(in srgb,var(--pc) 25%,transparent)}
.pf h2{margin:8px 0 0;font-family:var(--serif);font-style:italic;font-weight:400;font-size:44px;line-height:1;letter-spacing:-.01em}
.pf .sci{margin:6px 0 0;font-family:var(--serif);font-style:italic;font-size:20px;color:var(--sage-deep)}
.pf .fam{margin:4px 0 0;font-size:13.5px;color:var(--muted)}
.pf .persona{margin:18px 0 0;font-family:var(--serif);font-size:21px;line-height:1.35;color:var(--ink);text-wrap:pretty}
.pf h3{margin:24px 0 10px;font-size:11.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.pf .tags{display:flex;flex-wrap:wrap;gap:6px}
.pf .tags span{padding:6px 11px;border-radius:99px;background:var(--cream);font-size:13.5px;font-weight:500}
.pf .tags.mk span{background:color-mix(in srgb,var(--pc) 22%,var(--paper))}
.pf p.small{margin:10px 0 0;font-size:14px;line-height:1.5;color:var(--ink)}
.pf ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px}
.pf li{font-size:14.5px;line-height:1.5;padding-left:16px;position:relative}
.pf li::before{content:"";position:absolute;left:0;top:.6em;width:6px;height:6px;border-radius:50%;background:var(--sage)}
.pf dl{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 18px;margin:0}
.pf dl div{min-width:0}
.pf dt{font-size:12px;font-weight:600;color:var(--muted)}
.pf dd{margin:2px 0 0;font-size:14px;line-height:1.4}
.pf .refs li::before{display:none}
.pf .refs li{padding:12px 14px;border:1px solid var(--line);border-radius:16px;font-size:13.5px}
.pf .refs a{color:var(--sage-deep);font-weight:600;text-decoration:none}
.pf .refs a:hover{text-decoration:underline}
.pf .refs .rt{display:block;margin-top:3px;font-family:var(--serif);font-size:16px;line-height:1.3;color:var(--ink)}
.pf .refs .rs{display:block;margin-top:6px;color:var(--muted)}
.pf .note{margin:18px 0 0;font-size:12.5px;line-height:1.5;color:var(--muted)}
@media (max-width:460px){.pf dl{grid-template-columns:1fr}.pf h2{font-size:38px}}
@keyframes pfRise{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
@keyframes pfFade{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){.stage{transition:none}.pf,.pf-scrim{animation:none}}
</style>

<div class="stage on" id="stage-chat" aria-label="Talk to Flora"></div>
<div class="stage" id="stage-world" aria-label="Your gut community"></div>

<script src="roster.js"></script>
<script src="cast.js"></script>
<script src="world.js"></script>
<script src="chat.js"></script>
<script src="app.js"></script>
